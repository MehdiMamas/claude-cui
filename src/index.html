<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'">
  <title>Claude CUI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><span class="eyebrow">CLAUDE CUI · COMPANION</span><h1>Your actions,<br>one click away.</h1><p>Build a prompt here. Paste it into Claude.</p></header>
  <main>
    <div class="row"><h2>Quick actions</h2><button id="edit" class="quiet">Edit buttons</button></div>
    <div id="actions" class="actions"></div>
    <form id="editor" hidden>
      <label>Button name<input id="label" maxlength="60" required placeholder="e.g. Explain"></label>
      <label>Text to append<textarea id="text" rows="3" maxlength="10000" required placeholder="Explain how this works."></textarea></label>
      <div class="row"><button type="submit">Add button</button><button id="reset" type="button" class="quiet">Restore examples</button></div>
      <p class="hint">Use × on a button to remove it. Changes stay on this device.</p>
    </form>
    <label class="draft-label" for="draft">Your draft</label>
    <textarea id="draft" rows="7" placeholder="Start typing, or click an action…"></textarea>
    <div class="row"><button id="copy" class="primary">Copy draft</button><button id="clear" class="quiet">Clear</button></div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <footer><label><input id="pin" type="checkbox"> Keep on top</label><span>No account needed</span></footer>
  <script src="renderer.js"></script>
</body>
</html>
